spring.application.name=order-service
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://database:5432/platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
platform.jwt-secret=${JWT_SECRET:change-me-in-development-use-a-long-random-secret}
platform.product-url=${PRODUCT_URL:http://product:8080}
